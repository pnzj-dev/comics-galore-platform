name: Deploy Frontend App

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Environment slug (Fly app name, Vite build args, and GitHub Environment name)"
      backend_url:
        required: true
        type: string
        description: "Base URL of the Encore backend environment (e.g. https://staging-comics-galore-backend-v5k2.encr.app)"
    secrets:
      FLY_API_TOKEN:
        required: true
      TURNSTILE_SITEKEY:
        required: true

jobs:
  deploy:
    name: Deploy ${{ matrix.app }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: cg-public
            dir: frontend-public
          - app: cg-admin
            dir: frontend-admin
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Ensure app exists
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl apps create "${{ matrix.app }}-${{ inputs.environment }}" -y || true
      - name: Set backend URL
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl secrets set BACKEND_URL="${{ inputs.backend_url }}" --app "${{ matrix.app }}-${{ inputs.environment }}" --stage
      - name: Set Logto runtime secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          LOGTO_ENDPOINT: ${{ vars.LOGTO_ENDPOINT }}
          PUBLIC_ID: ${{ vars.LOGTO_PUBLIC_APP_ID }}
          PUBLIC_SECRET: ${{ secrets.LOGTO_PUBLIC_APP_SECRET }}
          ADMIN_ID: ${{ vars.LOGTO_ADMIN_APP_ID }}
          ADMIN_SECRET: ${{ secrets.LOGTO_ADMIN_APP_SECRET }}
          ENC_KEY: ${{ secrets.LOGTO_COOKIE_ENCRYPTION_KEY }}
        run: |
          if [ "${{ matrix.app }}" = "cg-public" ]; then
            LOGTO_APP_ID="$PUBLIC_ID"; LOGTO_APP_SECRET="$PUBLIC_SECRET"
          else
            LOGTO_APP_ID="$ADMIN_ID"; LOGTO_APP_SECRET="$ADMIN_SECRET"
          fi
          flyctl secrets set \
            LOGTO_ENDPOINT="$LOGTO_ENDPOINT" \
            LOGTO_APP_ID="$LOGTO_APP_ID" \
            LOGTO_APP_SECRET="$LOGTO_APP_SECRET" \
            LOGTO_COOKIE_ENCRYPTION_KEY="$ENC_KEY" \
            --app "${{ matrix.app }}-${{ inputs.environment }}" --stage
      - name: Deploy
        working-directory: ${{ matrix.dir }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --app "${{ matrix.app }}-${{ inputs.environment }}" \
            --build-arg VITE_BACKEND_URL="${{ inputs.backend_url }}" \
            --build-arg VITE_API_URL="${{ inputs.backend_url }}" \
            --build-arg VITE_TURNSTILE_SITEKEY="${{ secrets.TURNSTILE_SITEKEY }}"
