name: Deploy MCP Worker

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Environment slug used in the Worker name"
      backend_url:
        required: true
        type: string
        description: "Base URL of the Encore backend environment"
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

jobs:
  deploy:
    name: Deploy cg-mcp (${{ inputs.environment }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        working-directory: mcp-worker
        run: bun install
      - name: Deploy
        working-directory: mcp-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy \
            --name "cg-mcp-${{ inputs.environment }}" \
            --var BACKEND_URL="${{ inputs.backend_url }}"
