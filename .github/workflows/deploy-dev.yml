name: Deploy Dev

on:
  push:
    branches: [dev]

jobs:
  deploy:
    uses: ./.github/workflows/deploy-app.yml
    with:
      environment: dev
      backend_url: https://dev-comics-galore-backend-v5k2.encr.app
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      TURNSTILE_SITEKEY: ${{ secrets.TURNSTILE_SITEKEY }}
