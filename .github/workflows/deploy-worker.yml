name: Deploy Temporal Worker

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Environment slug used in the Fly app name"
    secrets:
      FLY_API_TOKEN:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Ensure app exists
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl apps create "cg-worker-${{ inputs.environment }}" -y || true
      - name: Deploy
        working-directory: temporal-worker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --app "cg-worker-${{ inputs.environment }}"
