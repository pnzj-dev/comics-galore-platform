name: Deploy Staging

on:
  push:
    branches: [staging]

jobs:
  deploy:
    uses: ./.github/workflows/deploy-app.yml
    with:
      environment: staging
      backend_url: https://staging-comics-galore-backend-v5k2.encr.app
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      TURNSTILE_SITEKEY: ${{ secrets.TURNSTILE_SITEKEY }}

  worker:
    uses: ./.github/workflows/deploy-worker.yml
    with:
      environment: staging
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  mcp:
    uses: ./.github/workflows/deploy-mcp.yml
    with:
      environment: staging
      backend_url: https://staging-comics-galore-backend-v5k2.encr.app
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
