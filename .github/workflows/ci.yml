name: CI

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev]

jobs:
  backend:
    name: Backend (encore test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Encore CLI
        run: |
          curl -L https://encore.dev/install.sh | bash
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"
      - name: Run backend tests
        working-directory: backend
        run: encore test ./...

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [frontend-public, frontend-admin]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Build (${{ matrix.dir }})
        working-directory: ${{ matrix.dir }}
        run: bun run build
        # NOTE: `bun run check` (svelte-check) is intentionally not run yet —
        # it reports pre-existing type errors. Re-enable once those are fixed.
