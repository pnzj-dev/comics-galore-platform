<!doctype html>
<html lang="en">
	<head>

		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<style>
			:root { color-scheme: light dark; }
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				font-family: system-ui, -apple-system, sans-serif;
				background: #f4f4f5;
				color: #18181b;
			}
			.wrap { text-align: center; padding: 2rem; }
			.brand { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
			.status { font-size: 4rem; font-weight: 800; margin: 0; }
			.msg { color: #52525b; max-width: 32rem; }
			a { color: #6d28d9; font-weight: 600; text-decoration: none; }
			a:hover { text-decoration: underline; }
		</style>
	</head>
	<body>
		<div class="wrap">
			<p class="brand">Comics Galore</p>
			<h1 class="status">Oops!</h1>

			<p><a href="/">Back to home</a></p>

</html>
